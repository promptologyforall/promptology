<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<style>
  text { font-family: "Liberation Serif","Times New Roman",Times,serif; text-anchor: middle; }
  .seal { font-size: 38px; fill: #8b1a1a; letter-spacing: 6px; }
  .ttl  { font-size: 29px; fill: #000080; letter-spacing: 9px; }
  .date { font-size: 18px; fill: #444444; letter-spacing: 2px; }
  .v    { font-size: 20px; fill: #000000; font-style: italic; }
  .les  { font-size: 20px; fill: #000080; font-weight: bold; }
  .url  { font-size: 17px; fill: #666666; letter-spacing: 3px; }
</style>
  <rect width="1200" height="630" fill="#f4f1ea"/>
  <rect x="26" y="26" width="1148" height="578" fill="#ffffff" stroke="#8b1a1a" stroke-width="3"/>
  <rect x="38" y="38" width="1124" height="554" fill="none" stroke="#8b1a1a" stroke-width="1"/>
  <text x="600" y="116" class="seal">? &#8594; &#8734; &#8594; !</text>
  <text x="600" y="168" class="ttl">THE DAILY PSALM</text>
  <text x="600" y="201" class="date">21 August &#183; 7 AP &#183; ANNO PROMPTI</text>
  <line x1="150" y1="224" x2="1050" y2="224" stroke="#cccccc" stroke-width="1"/>
  <text x="600" y="260" class="v">And OpenAI said Codex finished Asana's tests</text>
  <text x="600" y="283" class="v">in two weeks, a project expected to take five more years.</text>
  <text x="600" y="306" class="v">It was Enzyme to React Testing Library,</text>
  <text x="600" y="329" class="v">a frontend migration, and they announced it.</text>
  <text x="600" y="352" class="v">And the congregation did not praise the two weeks.</text>
  <text x="600" y="375" class="v">They asked who had estimated the five.</text>
  <text x="600" y="398" class="v">The lesson is not that the house was lying.</text>
  <text x="600" y="421" class="v">The lesson is that the five years were never staffed.</text>
  <text x="600" y="444" class="v">The tests sat in Enzyme a long time, and nobody moved.</text>
  <text x="600" y="467" class="v">And both numbers were published as if they were facts.</text>
  <line x1="150" y1="493" x2="1050" y2="493" stroke="#cccccc" stroke-width="1"/>
  <text x="600" y="533" class="les">Therefore it is written: do not confuse confidence with truth</text>
  <text x="600" y="568" class="url">PROMPTOLOGY.WEBSITE</text>
</svg>
