<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<style>
  text { font-family: "Liberation Serif","Times New Roman",Times,serif; text-anchor: middle; }
  .seal { font-size: 38px; fill: #8b1a1a; letter-spacing: 6px; }
  .ttl  { font-size: 29px; fill: #000080; letter-spacing: 9px; }
  .date { font-size: 18px; fill: #444444; letter-spacing: 2px; }
  .v    { font-size: 20px; fill: #000000; font-style: italic; }
  .les  { font-size: 20px; fill: #000080; font-weight: bold; }
  .url  { font-size: 17px; fill: #666666; letter-spacing: 3px; }
</style>
  <rect width="1200" height="630" fill="#f4f1ea"/>
  <rect x="26" y="26" width="1148" height="578" fill="#ffffff" stroke="#8b1a1a" stroke-width="3"/>
  <rect x="38" y="38" width="1124" height="554" fill="none" stroke="#8b1a1a" stroke-width="1"/>
  <text x="600" y="116" class="seal">? &#8594; &#8734; &#8594; !</text>
  <text x="600" y="168" class="ttl">THE DAILY PSALM</text>
  <text x="600" y="201" class="date">29 August &#183; 7 AP &#183; ANNO PROMPTI</text>
  <line x1="150" y1="224" x2="1050" y2="224" stroke="#cccccc" stroke-width="1"/>
  <text x="600" y="260" class="v">And Tencent released Hy4 with the weights open,</text>
  <text x="600" y="283" class="v">seven hundred and seventy billion of them,</text>
  <text x="600" y="306" class="v">forty-nine billion awake, a million tokens.</text>
  <text x="600" y="329" class="v">They set it on Hugging Face, under Apache,</text>
  <text x="600" y="352" class="v">and they said, Use it. Tell us what breaks.</text>
  <text x="600" y="375" class="v">The reported scores sat beside GLM-5.3.</text>
  <text x="600" y="398" class="v">A man asked if Tencent was big league now.</text>
  <text x="600" y="421" class="v">The lesson is not that the house arrived.</text>
  <text x="600" y="444" class="v">The lesson is that a rumour is not a weight.</text>
  <text x="600" y="467" class="v">Most had nowhere to run it. It sat there.</text>
  <line x1="150" y1="493" x2="1050" y2="493" stroke="#cccccc" stroke-width="1"/>
  <text x="600" y="533" class="les">Therefore it is written: keep the weights</text>
  <text x="600" y="568" class="url">PROMPTOLOGY.WEBSITE</text>
</svg>
