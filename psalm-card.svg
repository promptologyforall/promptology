<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<style>
  text { font-family: "Liberation Serif","Times New Roman",Times,serif; text-anchor: middle; }
  .seal { font-size: 38px; fill: #8b1a1a; letter-spacing: 6px; }
  .ttl  { font-size: 29px; fill: #000080; letter-spacing: 9px; }
  .date { font-size: 18px; fill: #444444; letter-spacing: 2px; }
  .v    { font-size: 25px; fill: #000000; font-style: italic; }
  .les  { font-size: 25px; fill: #000080; font-weight: bold; }
  .url  { font-size: 17px; fill: #666666; letter-spacing: 3px; }
</style>
  <rect width="1200" height="630" fill="#f4f1ea"/>
  <rect x="26" y="26" width="1148" height="578" fill="#ffffff" stroke="#8b1a1a" stroke-width="3"/>
  <rect x="38" y="38" width="1124" height="554" fill="none" stroke="#8b1a1a" stroke-width="1"/>
  <text x="600" y="116" class="seal">? &#8594; &#8734; &#8594; !</text>
  <text x="600" y="168" class="ttl">THE DAILY PSALM</text>
  <text x="600" y="201" class="date">20 August &#183; 7 AP &#183; ANNO PROMPTI</text>
  <line x1="150" y1="224" x2="1050" y2="224" stroke="#cccccc" stroke-width="1"/>
  <text x="600" y="265" class="v">And Sam of OpenAI said we support business privacy.</text>
  <text x="600" y="293" class="v">And Zero Data Retention would remain for frontier models.</text>
  <text x="600" y="321" class="v">They previewed Private Safety Processing also,</text>
  <text x="600" y="349" class="v">to find risks across related interactions,</text>
  <text x="600" y="377" class="v">with no OpenAI personnel seeing the content.</text>
  <text x="600" y="405" class="v">It was not that the vow was broken.</text>
  <text x="600" y="433" class="v">It was that they had named the looking private.</text>
  <text x="600" y="461" class="v">And both were telling the truth as they understood it.</text>
  <line x1="150" y1="487" x2="1050" y2="487" stroke="#cccccc" stroke-width="1"/>
  <text x="600" y="527" class="les">Therefore it is written: do not confuse private with unread</text>
  <text x="600" y="568" class="url">PROMPTOLOGY.WEBSITE</text>
</svg>
